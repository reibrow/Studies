<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Text Animationss</title>
</head>

<body>
    <div class="main">
        <div class="container">
            <h1 class="animate-bounce">Bounce</h1>
        </div>
        <div class="container">
            <h1 class="animate-fadeIn">FadeIn</h1>
        </div>
        <div class="container">
            <h1 class="animate-fadeOut">FadeOut</h1>
        </div>
        <div class="container">
            <h1 class="animate-flip">Flip</h1>
        </div>
        <div class="container">
            <h1 class="animate-tada">Tada</h1>
        </div>
        <div class="container">
            <h1 class="animate-heartBeat">HeartBeat</h1>
        </div>
        <div class="container">
            <h1 class="animate-headShake">HeadShake</h1>
        </div>
        <div class="container">
            <h1 class="animate-zoomIn">ZoomIn</h1>
        </div>
        <div class="container">
            <h1 class="animate-typeWriter">TypeWriter</h1>
        </div>
        <div class="container">
            <div class="animate-fade-word">
                <span>Olá</span> <span>Mundo</span> <span>!</span>
            </div>
        </div>
        <div class="container">
            <h1 class="animate-slide-in">SlideIn</h1>
        </div>
        <div class="container">
            <h1 class="animate-glow">Glow</h1>
        </div>
        <div class="container">
            <h1 class="animate-wobble">Wobble</h1>
        </div>
    </div>
</body>

</html>
